<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soal Kuis</title>
  <link rel="icon" href="img/logo.png" type="image/x-icon"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet"/>

<style>
* {
    box-sizing: border-box;
}
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #EBE3D5;
    background-image: linear-gradient(315deg, #EBE3D5 0%, #F3EEEA 100%);
}

/* Buat konten di tengah layar */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Header hanya teks */
.header {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 20px;
    color: #333;
}

/* Kotak soal */
.quiz-container {
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 0 10px 2px rgba(100, 100, 100, 0.1);
    width: 600px;
    max-width: 90%;
    padding: 20px;
}

/* Judul kuis */
.quiz-header {
    text-align: center;
    margin-bottom: 20px;
}
.question-indicator {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
}
.question {
    font-size: 1.1rem;
    text-align: center;
    margin-bottom: 15px;
}

/* Opsi jawaban */
.options {
    width: 100%;
}
ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
ul li {
  list-style-type: none;
  display: flex;
  align-items: center;
}
ul li label {
    cursor: pointer;
}

/* Tombol kuis */
.button-container {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}
button {
    background-color: #776B5D;
    color: #fff;
    border: none;
    width: 48%;
    cursor: pointer;
    font-size: 1.1rem;
    font-family: inherit;
    padding: 1.2rem;
    border-radius: 5px;
}
#back-button {
    background-color: #FF69B4;
}
button:hover {
    background-color: #6a5f52;
}
button:focus {
    outline: none;
    background-color: #99B080;
}
#popup-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.popup {
  background: white;
  padding: 30px 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  transform: translateY(100%);
  opacity: 0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

/* Saat popup aktif (muncul) */
#popup-backdrop.show .popup {
  transform: translateY(0);
  opacity: 1;
}

/* Saat popup nonaktif (hilang ke bawah) */
#popup-backdrop.hide .popup {
  transform: translateY(100%);
  opacity: 0;
}
.popup-icon {
  font-size: 3rem;
  margin-bottom: 10px;
}

</style>

</style>

</head>
<body>

  <div class="header">
      Keelompok IV
  </div>

  <div class="quiz-container">
      <div class="quiz-header">
          <h2>Kuis Pengetahuan Umum</h2>
      </div>
      <div class="question-indicator" id="question-indicator">Soal ke 1</div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="button-container">
          <button id="submit-button" onclick="checkAnswer()">Jawab</button>
          <button id="back-button" onclick="goBack()">Kembali</button>
      </div>
  </div>
<div id="popup-backdrop">
  <div class="popup">
    <div class="popup-icon" id="popup-icon">❗</div>
    <h3 id="popup-title">Jawaban</h3>
    <p id="popup-message">Isi hasil jawaban...</p>
    <button onclick="closePopup()">Lanjut</button>
  </div>
</div>

<script>
  const questions = [
    { question: "Apa ibukota Indonesia?", options: ["Jakarta", "Bandung", "Surabaya"], answer: "Jakarta" },
    { question: "Siapa presiden pertama Indonesia?", options: ["Soekarno", "Soeharto", "Jokowi"], answer: "Soekarno" },
    { question: "Apa warna bendera Indonesia?", options: ["Merah Putih", "Merah Kuning", "Biru Putih"], answer: "Merah Putih" },
    { question: "Apa mata uang Indonesia?", options: ["Rupiah", "Dollar", "Euro"], answer: "Rupiah" },
    { question: "Siapa penemu listrik?", options: ["Thomas Edison", "Albert Einstein", "Nikola Tesla"], answer: "Thomas Edison" }
  ];

  let currentQuestionIndex = 0;

  function loadQuestion() {
    const question = questions[currentQuestionIndex];
    document.getElementById('question-indicator').textContent = `Soal ke ${currentQuestionIndex + 1}`;
    document.getElementById('question').textContent = question.question;
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';
    question.options.forEach(option => {
      const li = document.createElement('li');
      li.innerHTML = `<label><input type="radio" name="option" value="${option}"> ${option}</label>`;
      optionsContainer.appendChild(li);
    });
  }

function checkAnswer() {
  const selected = document.querySelector('input[name="option"]:checked');
  const popup = document.getElementById('popup-backdrop');
  const title = document.getElementById('popup-title');
  const message = document.getElementById('popup-message');
  const icon = document.getElementById('popup-icon');

  if (!selected) {
    title.textContent = "Peringatan";
    message.textContent = "Silakan pilih jawaban terlebih dahulu.";
    icon.textContent = "❌"; // Ikon silang
    popup.classList.add("active");
    return;
  }

  const isCorrect = selected.value === questions[currentQuestionIndex].answer;
  title.textContent = isCorrect ? "Jawaban Benar!" : "Jawaban Salah!";
  message.textContent = isCorrect
    ? "Selamat, jawaban Anda benar."
    : `Jawaban yang benar adalah: ${questions[currentQuestionIndex].answer}`;
  icon.textContent = isCorrect ? "✅" : "❌"; // Centang atau silang
  popup.classList.add("active");
}

function closePopup() {
  const popup = document.getElementById('popup-backdrop');
  popup.classList.remove("show");
  popup.classList.add("hide");

  setTimeout(() => {
    popup.style.display = "none";
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      document.getElementById('question-indicator').textContent = "";
      document.getElementById('question').textContent = "Terima kasih telah mengikuti kuis!";
      document.getElementById('options').innerHTML = "";
      const btn = document.getElementById('submit-button');
      btn.textContent = "Ulangi";
      btn.onclick = () => {
        currentQuestionIndex = 0;
        loadQuestion();
        btn.textContent = "Jawab";
        btn.onclick = checkAnswer;
      };
    }
  }, 400);
}

  function goBack() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      loadQuestion();
    } else {
      window.location.href = 'index.html';
    }
  }

  function showResults() {
    alert("Hasil belum tersedia.");
  }

  window.onload = loadQuestion;
</script>

</body>
</html>
